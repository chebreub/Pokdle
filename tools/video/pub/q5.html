<!doctype html>
<!-- Quiz courts du 11/11/2026 (fonds de pub/fonds.html) : « PAGE=pub/q5.html node render.js type1|pom1|lourd1 ». -->
<html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=block" rel="stylesheet">
<style>
:root{--ink:#2E2A33;--cream:#FFF8EF;--blue:#4069E0;--yellow:#FFD45C;--green:#3FBF5A;--red:#E0402E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Fredoka,sans-serif;color:var(--ink)}
.layer{position:absolute;inset:0}
#bgPom{background:var(--cream)}
#bgPom::before{content:'';position:absolute;inset:0;opacity:.07;background-image:radial-gradient(circle at 50% 50%,transparent 26px,var(--ink) 27px,var(--ink) 31px,transparent 32px),linear-gradient(transparent 47px,var(--ink) 47px,var(--ink) 53px,transparent 53px);background-size:140px 140px,140px 140px}
#bgLourd{background:linear-gradient(#FFB36B 0%,#FF8A5C 45%,#7C5BD6 100%)}
#sun{position:absolute;left:50%;top:620px;width:760px;height:760px;margin-left:-380px;border-radius:50%;background:radial-gradient(#FFE6A6,#FFD45C 60%,rgba(255,212,92,0) 72%)}
#bgType .a,#bgType .b{position:absolute;inset:0}
#title{position:absolute;left:0;right:0;top:120px;text-align:center;font:700 96px/1.04 Fredoka;color:#fff;-webkit-text-stroke:16px var(--ink);paint-order:stroke fill;transform-origin:50% 50%}
#title.pom{color:var(--blue);-webkit-text-stroke:0}
#sub{position:absolute;left:50%;transform:translateX(-50%);top:345px;padding:10px 30px;border-radius:999px;background:#fff;border:5px solid var(--ink);font:700 40px Fredoka;white-space:nowrap}
#hook{position:absolute;left:60px;right:60px;top:820px;text-align:center;font:700 74px/1.15 Fredoka;color:#fff;-webkit-text-stroke:14px var(--ink);paint-order:stroke fill}
#wm{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;padding:12px 30px;border-radius:999px;background:var(--yellow);border:5px solid var(--ink);font:700 44px Fredoka;z-index:5}
#timer{position:absolute;left:90px;right:90px;bottom:160px;height:42px;border-radius:21px;border:5px solid var(--ink);background:#fff;overflow:hidden}
#fill{position:absolute;left:0;top:0;bottom:0}
#qn{position:absolute;left:0;right:0;bottom:214px;text-align:center;font:700 44px Fredoka;color:#fff;-webkit-text-stroke:10px var(--ink);paint-order:stroke fill}
/* type */
#mon{position:absolute;left:50%;top:430px;width:640px;height:640px;margin-left:-320px;object-fit:contain;filter:drop-shadow(0 18px 0 rgba(46,42,51,.25))}
#opts{position:absolute;left:70px;right:70px;top:1130px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
#opts>div{position:relative;display:flex;align-items:center;gap:14px;padding:24px 22px;border-radius:30px;background:#fff;border:6px solid var(--ink);font:700 44px Fredoka;transition:none}
#opts span{padding:6px 16px;border-radius:14px;color:#fff;font:700 34px Fredoka;-webkit-text-stroke:0}
#opts .ok{background:#D9F7D6;border-color:var(--green);box-shadow:0 0 0 8px var(--green)}
#opts .no{opacity:.35}
/* plus ou moins */
.card{position:absolute;left:100px;right:100px;height:520px;border-radius:48px;background:#fff;border:6px solid var(--ink);box-shadow:0 14px 0 rgba(46,42,51,.15)}
.card img{position:absolute;left:24px;top:50%;width:430px;height:430px;margin-top:-215px;object-fit:contain}
.card .n{position:absolute;right:46px;top:110px;font:700 62px Fredoka;text-align:right;white-space:nowrap}
.card .v{position:absolute;right:46px;top:200px;font:700 150px Fredoka;color:var(--blue);text-align:right}
.card .v.q{color:#c8c2d0}
#btns{position:absolute;left:100px;right:100px;top:1560px;display:flex;gap:30px}
#btns b{flex:1;padding:24px 0;border-radius:999px;text-align:center;font:700 54px Fredoka;color:#fff;border:6px solid var(--ink)}
#btns .ok{box-shadow:0 0 0 10px #6BE05A}
#btns .no{opacity:.3}
#diff{position:absolute;left:50%;transform:translateX(-50%);top:1010px;padding:10px 26px;border-radius:999px;background:var(--ink);color:#fff;font:700 38px Fredoka;white-space:nowrap;z-index:3}
/* lourd */
#scale{position:absolute;left:0;top:700px}
.pan{position:absolute;width:440px;text-align:center}
.pan img{width:400px;height:400px;object-fit:contain;filter:drop-shadow(0 12px 0 rgba(46,42,51,.25))}
.pan .kg{display:inline-block;margin-top:6px;padding:8px 24px;border-radius:999px;background:#fff;border:5px solid var(--ink);font:700 46px Fredoka;white-space:nowrap}
.pan .kg.ok{background:#D9F7D6;border-color:var(--green);box-shadow:0 0 0 8px var(--green)}
.pan .L{position:absolute;left:30px;top:10px;width:76px;height:76px;border-radius:50%;background:var(--ink);color:#fff;font:700 46px/76px Fredoka}
/* cards */
#card{position:absolute;left:60px;right:60px;top:300px;border-radius:44px;background:#fff;border:7px solid var(--ink);padding:56px 40px;text-align:center;z-index:6;box-shadow:0 16px 0 rgba(46,42,51,.2)}
#card .big{font:700 74px/1.08 Fredoka;color:var(--blue)}
#card .mid{font:700 52px/1.2 Fredoka;margin-top:30px}
#card .sm{font:600 40px/1.3 Fredoka;color:#6b6475;margin-top:24px}
#card .site{color:var(--ink);background:var(--yellow);display:inline-block;padding:10px 40px;border-radius:999px;border:6px solid var(--ink);margin-top:36px}
#card .shot{display:block;width:620px;margin:30px auto 0;border-radius:36px;border:6px solid var(--ink)}
</style></head><body>
<div id="stage">
 <div id="bgPom" class="layer"></div>
 <div id="bgLourd" class="layer"><div id="sun"></div></div>
 <div id="bgType" class="layer"><div class="a"></div><div class="b"></div></div>
 <div id="title"></div><div id="sub"></div>
 <img id="mon">
 <div id="opts"></div>
 <div id="cTop" class="card"><img><div class="n"></div><div class="v"></div></div>
 <div id="cBot" class="card"><img><div class="n"></div><div class="v"></div></div>
 <div id="diff"></div><div id="btns"><b style="background:#E0402E">▲ Plus</b><b style="background:#4069E0">▼ Moins</b></div>
 <svg id="scale" width="1080" height="900" viewBox="0 0 1080 900"><g stroke="#2E2A33" stroke-width="12" stroke-linecap="round" fill="none">
  <path d="M540 150 V780"/><path d="M380 840 H700 L640 780 H440 Z" fill="#fff"/>
  <g id="beam"><path d="M190 190 H890"/></g></g>
  <circle cx="540" cy="190" r="26" fill="#FFD45C" stroke="#2E2A33" stroke-width="10"/></svg>
 <div id="panA" class="pan"><span class="L">A</span><img><div class="kg"></div></div>
 <div id="panB" class="pan"><span class="L">B</span><img><div class="kg"></div></div>
 <div id="hook"></div>
 <div id="qn"></div><div id="timer"><div id="fill"></div></div>
 <div id="wm">pokdle.fr</div>
 <div id="card"></div>
</div>
<script src="q5.js"></script>
</body></html>
