<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=block" rel="stylesheet">
<style>
/* L'écran « Dessine-le ! » de la Party Room, reproduit d'après App/party-room.css (×2,2 pour 1080 px). */
:root{--ink:#2E2A33;--cream:#FFF8EF;--lav:#7C5BD6;--yellow:#FFD45C;--green:#6BE05A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cream)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--cream);font-family:Nunito,sans-serif;color:var(--ink)}
#fade{position:absolute;inset:0;background:#000;opacity:0}
.px{font-family:'Press Start 2P',monospace;text-align:center;white-space:nowrap}
#title{position:absolute;left:0;right:0;top:96px;font-size:64px;color:var(--yellow);text-shadow:6px 6px 0 var(--ink),-4px -4px 0 var(--ink),4px -4px 0 var(--ink),-4px 4px 0 var(--ink),0 6px 0 var(--ink),6px 0 0 var(--ink)}
#hook{position:absolute;left:0;right:0;top:206px;text-align:center;font:700 52px Fredoka,sans-serif;color:var(--ink)}
#pill{position:absolute;left:60px;top:300px;height:76px;padding:0 30px;border-radius:999px;background:var(--lav);color:#fff;font:700 38px Fredoka,sans-serif;display:flex;align-items:center}
#top{position:absolute;left:60px;right:60px;top:396px;height:160px;display:flex;flex-wrap:wrap;align-content:center;align-items:center;gap:10px 16px;padding:10px 30px;border-radius:40px;background:#fff;border:2px solid #F0E8DD}
#top .letters{width:100%;font:700 52px Fredoka,sans-serif;letter-spacing:.12em;white-space:pre}
#top .chip{padding:8px 22px;border-radius:999px;background:#F4F1EC;color:#9a93a3;font:800 30px Nunito,sans-serif;white-space:nowrap}
#top img{width:112px;height:112px;object-fit:contain}
#top small{display:block;font:900 26px Nunito;letter-spacing:.08em;color:var(--lav)}
#top b{font:700 54px Fredoka,sans-serif}
#top .found{margin-left:auto;text-align:right;font:800 30px Nunito;color:#6b6475}
#board{position:absolute;left:60px;right:60px;top:572px;padding:16px;border-radius:44px;background:#fff;border:2px solid #F0E8DD}
#cv{position:relative;width:924px;height:693px;border-radius:30px;background:#FFFDF9;border:4px dashed #E6DCCF;overflow:hidden}
#ink{position:absolute}
#sticker{position:absolute;right:30px;bottom:30px;width:330px;height:330px;border-radius:50%;background:#F3EEFC;border:8px solid var(--lav);box-shadow:0 14px 0 rgba(46,42,51,.18)}
#sticker img{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain}
#feed{position:absolute;left:60px;right:60px;top:1326px;height:250px;display:flex;flex-direction:column;gap:4px;padding:18px 30px;border-radius:40px;background:#fff;border:2px solid #F0E8DD;font:700 36px Nunito,sans-serif;color:#6b6475;overflow:hidden}
#feed .ok{color:#1f7a45;font-weight:900}
#feed .muted{color:#b3acbb}
#hud{position:absolute;left:60px;right:60px;top:1610px;height:250px;border-radius:40px;background:var(--ink)}
#num{position:absolute;left:0;right:0;top:34px;font-size:46px;color:#fff}
#bar{position:absolute;left:56px;right:56px;top:110px;height:40px;border-radius:12px;border:5px solid #fff;background:#57525e;overflow:hidden}
#fill{position:absolute;left:0;top:0;bottom:0}
#pts{position:absolute;left:0;right:0;top:180px;font-size:40px;color:#fff}
#card{position:absolute;left:60px;right:60px;border-radius:44px;background:rgba(46,42,51,.95);border:7px solid #fff;padding:50px 40px;text-align:center}
#card .big{font:50px/1.5 'Press Start 2P';color:var(--yellow)}
#card .mid{font:700 54px/1.25 Fredoka,sans-serif;color:#fff;margin-top:30px}
#card .sm{font:600 42px/1.3 Fredoka,sans-serif;color:#d9d3e2;margin-top:24px}
#card .site{font-size:54px;color:var(--green);margin-top:40px}
</style></head><body>
<div id="stage">
 <div id="title" class="px"></div><div id="hook"></div>
 <div id="pill"></div>
 <div id="top"></div>
 <div id="board"><div id="cv"><canvas id="ink"></canvas><div id="sticker"><img id="art"></div></div></div>
 <div id="feed"></div>
 <div id="hud"><div id="num" class="px"></div><div id="bar"><div id="fill"></div></div><div id="pts" class="px"></div></div>
 <div id="card"></div>
 <div id="fade"></div>
</div>
<script src="dessin.js"></script>
</body></html>
