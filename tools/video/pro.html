<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=block" rel="stylesheet">
<style>
:root{--ink:#2E2A33;--cream:#FFF8EF;--blue:#4069E0;--yellow:#FFD45C;--lav:#7C5BD6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#120e24}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Nunito,sans-serif;color:#fff}
#world{position:absolute;inset:0}
.L{position:absolute;inset:0}
#bg{background:radial-gradient(120% 75% at 50% 18%,#3b2f74 0%,#221a4a 48%,#120e24 100%)}
#pat{position:absolute;left:-600px;top:-600px;width:2400px;height:3200px;opacity:.07;transform-origin:50% 50%;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180'><g fill='none' stroke='white' stroke-width='7'><circle cx='90' cy='90' r='52'/><path d='M38 90h104'/><circle cx='90' cy='90' r='15'/></g></svg>");background-size:180px 180px}
.blob{position:absolute;border-radius:50%;filter:blur(110px);opacity:.5}
#speed{opacity:0;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.16) 0 1.4deg,transparent 1.4deg 7deg);-webkit-mask:radial-gradient(circle at 50% 50%,transparent 0 26%,#000 60%)}
#vign{background:radial-gradient(130% 90% at 50% 45%,transparent 55%,rgba(5,3,15,.65) 100%);pointer-events:none}
#grain{opacity:.08;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.k{position:absolute;white-space:nowrap;font-family:Fredoka;font-weight:700;line-height:1;transform-origin:50% 55%}
.k .e{position:absolute;left:0;top:0;color:transparent;-webkit-text-stroke:3px currentColor;opacity:0}
.k .m{position:relative;paint-order:stroke fill}
.c{left:0;right:0;text-align:center}
.pill{position:absolute;font:900 34px Nunito;letter-spacing:.16em;text-transform:uppercase;padding:13px 28px;border-radius:999px;white-space:nowrap}
.mask{position:absolute;overflow:hidden;left:0;right:0;text-align:center}
#scene{position:absolute;inset:0;perspective:1900px;perspective-origin:50% 48%}
.card{position:absolute;border-radius:44px;overflow:hidden;background:var(--cream);transform-style:preserve-3d;box-shadow:0 50px 100px rgba(0,0,0,.5),0 0 0 5px rgba(255,255,255,.16)}
.card .wrap{position:absolute;inset:0}
.card img.f{position:absolute;left:0;top:0;transform-origin:0 0}
.card .gloss{position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.35) 50%,transparent 58%);opacity:.0}
.card .rim{position:absolute;inset:0;border-radius:44px;box-shadow:inset 0 0 0 8px var(--yellow);opacity:0}
.ring{position:absolute;border-radius:50%;border:10px solid #fff;opacity:0}
.seg{position:absolute;top:0;height:26px;border-radius:13px;background:rgba(255,255,255,.18);overflow:hidden}
.seg i{position:absolute;inset:0;background:linear-gradient(90deg,#FFD45C,#ffb547);transform-origin:0 50%}
.stamp{position:absolute;font:700 92px Fredoka;color:#fff;-webkit-text-stroke:12px var(--ink);paint-order:stroke fill;white-space:nowrap;opacity:0}
.conf{position:absolute;left:0;top:0;width:26px;height:14px;border-radius:4px}
.spark{position:absolute;left:0;top:0;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 18px 6px rgba(255,212,92,.8)}
#rays{position:absolute;width:2000px;height:2000px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,212,92,.30) 0 8deg,rgba(255,212,92,0) 8deg 20deg);-webkit-mask:radial-gradient(circle,#000 0,#000 25%,transparent 66%)}
#halo{position:absolute;width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,rgba(255,240,200,.55),rgba(124,91,214,0) 62%)}
.art{position:absolute;width:780px;height:780px}
#band1,#band2,#band3{position:absolute;left:-700px;top:-400px;width:2600px;height:900px;transform-origin:50% 50%}
#end{background:radial-gradient(110% 70% at 50% 38%,#5d48bd 0%,#3a2f85 48%,#1c1745 100%)}
.orb{position:absolute;width:250px;height:250px;filter:drop-shadow(0 18px 22px rgba(0,0,0,.4))}
#epill{position:absolute;left:170px;width:740px;top:1105px;height:176px;border-radius:999px;background:var(--cream);color:var(--ink);font:700 116px/176px Fredoka;text-align:center;overflow:hidden;box-shadow:0 18px 0 rgba(0,0,0,.28)}
#epill i{position:absolute;top:-30px;width:130px;height:240px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);transform:skewX(-20deg)}
</style></head>
<body><div id="stage"><div id="world">
  <div class="L" id="bg"><div id="pat"></div><div class="blob" id="b1" style="width:760px;height:760px;background:#7C5BD6"></div><div class="blob" id="b2" style="width:640px;height:640px;background:#4069E0"></div><div class="blob" id="b3" style="width:560px;height:560px;background:#c0508f"></div></div>
  <div class="L" id="speed"></div>
  <div class="L" id="hookBig"></div>
  <div class="L" id="header"></div>
  <div id="scene"></div>
  <div class="L" id="fx"></div>
  <div class="L" id="count"></div>
  <div class="L" id="reveal"></div>
  <div class="L" id="end"></div>
  <div class="L" id="bands"><div id="band1" style="background:#FFD45C"></div><div id="band2" style="background:#7C5BD6"></div><div id="band3" style="background:#4069E0"></div></div>
</div>
<div class="L" id="flash" style="background:#fff;opacity:0"></div>
<div class="L" id="vign"></div><div class="L" id="grain"></div>
</div>
<svg width="0" height="0" style="position:absolute"><filter id="mb" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur id="mbg" stdDeviation="0 0"/></filter><filter id="mbx" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur id="mbgx" stdDeviation="0 0"/></filter></svg>
<script src="pro.js"></script><script src="pro-scene.js"></script><script src="pro-common.js"></script>
</body></html>
