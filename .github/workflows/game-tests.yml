name: Game regression tests

on:
  pull_request:
    paths:
      - "App/**"
      - ".github/workflows/game-tests.yml"
      # CI-only changes must still validate the Node test suite.
      - ".github/workflows/browser-quality.yml"

permissions:
  contents: read

jobs:
  game-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: App/package-lock.json
      # package.json postinstall already builds the client during npm ci.
      - run: npm ci
      - run: npm test
